<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><title>AIRWISE — ақылды сыныптың экологиялық мониторингі</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f8fa;--card:#fff;--tx:#0b2a4a;--mu:#5b7083;--bd:#dfeaf0;--ac:#0e8f9c;--ac2:#e3f5f6;--ok:#15934a;--warn:#c98a00;--bad:#d62b2b;--okb:#e8f7ee;--wb:#fff4d6;--bb:#fde8e8;--sh:0 4px 18px rgba(11,42,74,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1620;--card:#11222e;--tx:#e6f0f6;--mu:#8fa6b6;--bd:#21394b;--ac:#2cc2cf;--ac2:#0f3037;--ok:#3ccf7a;--warn:#f0b429;--bad:#ff6b6b;--okb:#0f2b1c;--wb:#33290a;--bb:#3a1717;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1620;--card:#11222e;--tx:#e6f0f6;--mu:#8fa6b6;--bd:#21394b;--ac:#2cc2cf;--ac2:#0f3037;--ok:#3ccf7a;--warn:#f0b429;--bad:#ff6b6b;--okb:#0f2b1c;--wb:#33290a;--bb:#3a1717;--sh:none;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,"Segoe UI",Arial,sans-serif}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--bd);padding:20px 14px}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:20px;letter-spacing:.3px;margin:0 6px 22px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0e8f9c,#1fb38a);display:grid;place-items:center}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--mu);letter-spacing:0}
nav a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;color:var(--mu);text-decoration:none;font-weight:500;margin-bottom:2px}
nav a:hover{background:var(--ac2)}nav a.on{background:var(--ac2);color:var(--ac);font-weight:600}
nav b{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
main{padding:20px 26px 40px;min-width:0}
#top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
#top h1{font-size:20px;margin:0}#top .mu,.mu{color:var(--mu)}
select,input[type=text],input[type=number]{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 10px}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible,.cp:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:16px;font-weight:600;background:var(--wb);color:var(--warn);border:1px solid var(--warn)}
.banner.real{background:var(--okb);color:var(--ok);border-color:var(--ok)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.warn{background:var(--wb);color:var(--warn)}.pill.bad{background:var(--bb);color:var(--bad)}
.met{cursor:pointer;transition:transform .15s}.met:hover{transform:translateY(-2px)}
.met .h{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.met .v{font-size:34px;font-weight:700;margin:6px 0 0}.met .v small{font-size:14px;color:var(--mu);font-weight:500}
.met .r{font-size:12px;color:var(--mu);display:flex;justify-content:space-between;margin-top:4px}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:120px;height:120px;flex:none}.ring svg{width:120px;height:120px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;padding-bottom:12px}.ring i{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-style:normal;font-size:11px;color:var(--mu)}
.rb{fill:none;stroke:var(--bd);stroke-width:10}.rf{fill:none;stroke-width:10;stroke-linecap:round}.rf.ok{stroke:var(--ok)}.rf.warn{stroke:var(--warn)}.rf.bad{stroke:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--ac2);color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:12px 0}
.stats .card{padding:12px}.stats b{display:block;font-size:22px}.stats span{color:var(--mu);font-size:12px}
.ch{position:relative;overflow-x:auto}.ch svg{width:100%;min-width:560px;height:auto;display:block}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--tx);color:var(--bg);border-radius:8px;padding:5px 9px;font-size:12px;white-space:nowrap;display:none;transform:translateX(-50%)}
.ax{fill:var(--mu);font-size:11px}.gl{stroke:var(--bd)}
.al{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;border-left:5px solid var(--warn)}.al.bad{border-color:var(--bad)}.al.done{opacity:.55;border-color:var(--bd)}.al>div{flex:1}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,1fr);gap:14px}
.cp{fill:var(--ac2);stroke:var(--ac);stroke-width:1.5;cursor:pointer}.cp:hover,.cp.sel{fill:var(--ac);}.cpt{font-size:11px;fill:var(--tx);pointer-events:none;font-weight:600}.cp.sel+.cpt{fill:#fff}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}.flow button{flex:1;min-width:130px;text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;font:inherit;cursor:pointer}
.flow button.on{border-color:var(--ac);background:var(--ac2)}.flow .ar{align-self:center;color:var(--mu)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;text-align:left;border-bottom:1px solid var(--bd);font-size:13px}th{color:var(--mu);font-weight:500}td input{width:78px}
.chg{color:var(--warn);font-weight:600}.sk{height:150px;border-radius:16px;background:linear-gradient(90deg,var(--bd),var(--ac2),var(--bd));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:36px 16px}.empty h2{margin:0 0 6px}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;overflow:auto;font-size:12px}
label.t{display:flex;gap:8px;align-items:center;margin:4px 0}
#chat{max-height:55vh;min-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}.msg{max-width:85%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:var(--ac);color:#fff}.msg.assistant{align-self:flex-start;background:var(--ac2)}.msg.err{background:var(--bb);color:var(--bad)}.chip:disabled,.btn:disabled{opacity:.5;cursor:default}
:root[data-theme="graphite"]{--bg:#0f0f10;--card:#1a1a1b;--tx:#f2f2f2;--mu:#9b9ba0;--bd:#2b2b2e;--ac:#2f6bff;--ac2:#14265a;--ok:#84cc16;--warn:#f0b429;--bad:#ff5c5c;--okb:#1d2a12;--wb:#33290a;--bb:#3a1717;--sh:none;color-scheme:dark}
:root[data-theme="light"]{--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mu:#5b6678;--bd:#e3e8f0;--ac:#2563eb;--ac2:#e6eeff;--ok:#4d9a0b;--warn:#c98a00;--bad:#d62b2b;--okb:#eaf6dc;--wb:#fff4d6;--bb:#fde8e8;--sh:0 4px 18px rgba(15,23,42,.06);color-scheme:light}
nav a.on{background:var(--ac);color:#fff}.logo i{background:linear-gradient(135deg,#2f6bff,#6aa0ff)}#devc{margin-top:22px}.br{display:flex;gap:24px;flex-wrap:wrap;align-items:center}.br ol{margin:6px 0 0;padding-left:20px}.br .bc{text-align:center;min-width:210px}
@media (max-width:860px){#devc{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:860px){.app{display:block}aside{padding:10px;border-right:0;border-bottom:1px solid var(--bd)}.logo{margin-bottom:8px}nav{display:flex;overflow-x:auto;gap:4px}nav a{white-space:nowrap;gap:6px}main{padding:14px}.two{grid-template-columns:1fr}}
</style></head><body>
<div class="app"><aside><div class="logo"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h7"/></svg></i><div>AIRWISE<small>Ақылды сынып</small></div></div><nav id="nav"></nav><div id="devc"></div></aside>
<main><div id="top"></div><div id="ban"></div><div id="main"></div></main></div>
<script>
const $=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
const META={co2:{n:'CO₂',u:'ppm',d:0},temp:{n:'Температура',u:'°C',d:1},hum:{n:'Ылғалдылық',u:'%',d:0},pm25:{n:'PM2.5',u:'µg/m³',d:0},pm10:{n:'PM10',u:'µg/m³',d:0},voc:{n:'VOC / газ индексі',u:'инд.',d:0},noise:{n:'Дыбыс деңгейі',u:'дБ',d:0}};
const KEYS=Object.keys(META),CARDS=['co2','temp','hum','pm25','voc','noise'];
const DEF={co2:[0,1000,0,1500],temp:[20,24,16,28],hum:[40,60,25,75],pm25:[0,15,0,35],pm10:[0,45,0,100],voc:[0,150,0,250],noise:[0,55,0,70]};
let S={th:clone(DEF),demo:true,name:'8-сынып',F:false,occ:'auto',types:{},ws:'ws://192.168.4.1:81'};
try{const x=JSON.parse(localStorage.getItem('airwise'));if(x)S={...S,...x}}catch(e){}
const save=()=>{try{localStorage.setItem('airwise',JSON.stringify(S))}catch(e){}};
const cv=(m,v)=>m=='temp'&&S.F?v*9/5+32:v,un=m=>m=='temp'?(S.F?'°F':'°C'):META[m].u,fv=(m,v)=>cv(m,v).toFixed(META[m].d);
const st=(m,v)=>{const[a,b,c,d]=S.th[m];return v>d||v<c?'bad':v>b||v<a?'warn':'ok'},STN={ok:'Қалыпты',warn:'Ескерту',bad:'Қауіпті'};
const rng=m=>{const[a,b]=S.th[m];return (a>0?fv(m,a)+'–':'≤ ')+fv(m,b)+' '+un(m)};
/* ---------- Деректер көзі: демо симулятор ---------- */
const D={},R={};KEYS.forEach(k=>{D[k]=[];R[k]=[]});
const data=()=>S.demo?D:R,last=m=>{const a=data()[m];return a.length?a[a.length-1]:null},hasData=()=>KEYS.some(k=>data()[k].length);
function occ(t,ov){if(ov=='empty')return .03;if(ov=='class')return .75;if(ov=='full')return 1;const d=new Date(t),h=d.getHours()+d.getMinutes()/60,w=d.getDay();if(w==0||w==6)return .03;return h>=8&&h<15&&!(h>=10.5&&h<10.75)?.8:.05}
const TG={co2:o=>420+o*1250,temp:(o,t)=>20.5+o*3+Math.sin(t/864e5*6.283)*.8,hum:o=>50-o*9,pm25:o=>5+o*9,pm10:o=>9+o*14,voc:o=>55+o*150,noise:o=>36+o*26};
const AMP={co2:12,temp:.08,hum:.4,pm25:.8,pm10:1.2,voc:6,noise:2.5},MINV={co2:400,temp:10,hum:10,pm25:1,pm10:2,voc:20,noise:30};let cur={};
function step(m,t,o,k){let v=cur[m];v+=(TG[m](o,t)-v)*k+(Math.random()-.5)*2*AMP[m];if(m=='noise'&&o>.5&&Math.random()<.04)v+=10;return cur[m]=Math.max(MINV[m],v)}
function seed(){KEYS.forEach(m=>D[m]=[]);const now=Date.now(),t0=now-7*864e5;KEYS.forEach(m=>cur[m]=TG[m](occ(t0,'auto'),t0));for(let t=t0;t<=now;t+=3e5){const o=occ(t,'auto');KEYS.forEach(m=>D[m].push({t,v:step(m,t,o,.3)}))}}
function tick(){const t=Date.now(),o=occ(t,S.occ);KEYS.forEach(m=>{D[m].push({t,v:step(m,t,o,.07)});if(D[m].length>5000)D[m].shift()})}
/* ---------- Деректер көзі: нақты ESP32 (WebSocket) ---------- */
const Real={ws:null,state:'idle',err:'',
 connect(){this.close();this.state='connecting';this.err='';try{const w=this.ws=new WebSocket(S.ws);
  w.onopen=()=>{this.state='live'};
  w.onmessage=e=>{try{const j=JSON.parse(e.data),t=Date.now();KEYS.forEach(k=>{if(typeof j[k]=='number'){R[k].push({t,v:j[k]});if(R[k].length>5000)R[k].shift()}})}catch(x){}};
  w.onerror=()=>{this.state='error';this.err='Серверге қосылу мүмкін болмады: '+S.ws};
  w.onclose=()=>{if(this.state!='error')this.state='idle'}}catch(e){this.state='error';this.err='Мекенжай қате: '+S.ws}},
 close(){if(this.ws){try{this.ws.close()}catch(e){}this.ws=null}this.state='idle'}};
/* ---------- Ескертулер ---------- */
let A=[],muted={},aid=0;
const MSG={co2:['CO₂ деңгейі жоғары','Бөлмені желдету ұсынылады.'],temp:['Температура жоғары','Терезені ашыңыз немесе бөлмені салқындатыңыз.'],tempL:['Температура төмен','Жылытуды тексеріңіз.'],hum:['Ауа ылғалдылығы жоғары','Бөлмені желдетіңіз.'],humL:['Ауа ылғалдылығы белгіленген деңгейден төмен','Ылғалдандырғышты қосуды қарастырыңыз.'],pm25:['PM2.5 концентрациясы жоғары','Желдетуді немесе ауа сүзгісін тексеріңіз.'],pm10:['PM10 концентрациясы жоғары','Желдетуді немесе ауа сүзгісін тексеріңіз.'],voc:['VOC көрсеткіші өсті','Ықтимал ауа ластану көздерін тексеріп, бөлмені желдетіңіз.'],noise:['Шу деңгейі жоғары','Сынып ішіндегі шу көзін азайтыңыз.']};
function evalAlerts(){KEYS.forEach(m=>{const p=last(m);if(!p)return;const s=st(m,p.v);
 if(s=='ok'){muted[m]=false;A.forEach(a=>{if(a.m==m&&!a.done)a.rec=true});return}
 if(S.types[m]===false||muted[m])return;
 const ex=A.find(a=>a.m==m&&!a.done&&!a.rec);if(ex&&(ex.lvl==s||ex.lvl=='bad'))return;if(ex)ex.done=true;
 A.forEach(a=>{if(a.m==m&&a.rec)a.done=true});
 const k=m+((m=='temp'||m=='hum')&&p.v<S.th[m][0]?'L':'');A.unshift({id:++aid,m,lvl:s,t:p.t,v:p.v,msg:MSG[k][0],act:MSG[k][1],done:false})})}
const resolve=id=>{const a=A.find(x=>x.id==id);if(a){a.done=true;muted[a.m]=true}render()};
const open_=()=>A.filter(a=>!a.done).length;
/* ---------- Көмекші есептеулер ---------- */
const ord={ok:0,warn:1,bad:2},overall=()=>{let o='ok';KEYS.forEach(m=>{const p=last(m);if(p){const s=st(m,p.v);if(ord[s]>ord[o])o=s}});return o};
function score(){let s=0,n=0;['co2','pm25','voc'].forEach(m=>{const p=last(m);if(!p)return;const d=S.th[m][3],v=p.v;s+=Math.max(0,Math.min(100,100-60*v/d-(v>d?40*(v-d)/d:0)));n++});return n?Math.round(s/n):null}
function trend(m){const a=data()[m];if(a.length<10)return'→';const f=x=>x.reduce((s,p)=>s+p.v,0)/x.length,n=a.length,d=f(a.slice(n-5))-f(a.slice(n-10,n-5)),e=S.th[m][3]*.004;return d>e?'↗':d<-e?'↘':'→'}
function forecast(){const p=data().co2,now=p[p.length-1];if(!now)return null;const q=p.filter(x=>x.t>=now.t-9e5);if(q.length<3)return null;
 let n=q.length,sx=0,sy=0,sxy=0,sxx=0;q.forEach(x=>{const u=(x.t-now.t)/6e4;sx+=u;sy+=x.v;sxy+=u*x.v;sxx+=u*u});let k=(n*sxy-sx*sy)/(n*sxx-sx*sx);if(!isFinite(k))k=0;
 const series=[];for(let i=0;i<=15;i++)series.push({t:now.t+i*6e4,v:Math.max(400,Math.min(5000,now.v+k*i))});return{slope:k,pred:series[15].v,series,now}}
const ds=(a,n=240)=>{if(a.length<=n)return a;const k=a.length/n,o=[];for(let i=0;i<n;i++){const s=a.slice(Math.floor(i*k),Math.floor((i+1)*k));o.push({t:s[s.length-1].t,v:s.reduce((x,p)=>x+p.v,0)/s.length})}return o};
const tm=t=>new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),tms=t=>new Date(t).toLocaleTimeString('ru-RU');
/* ---------- Графиктер ---------- */
let CH={},hov=false,cid=0;
function chart(pts,m,fc){const W=820,H=270,L=50,Rr=12,T=12,B=26,f=v=>cv(m,v),all=pts.concat(fc||[]);if(!pts.length)return'<p class="mu">Деректер жоқ</p>';
 const id='c'+(++cid),t0=pts[0].t,t1=all[all.length-1].t,th=S.th[m].map(f),vals=all.map(p=>f(p.v));
 let mn=Math.min(...vals,th[0]>0?th[0]:1e9),mx=Math.max(...vals,th[1]);if(Math.max(...vals)>th[1]*.9)mx=Math.max(mx,th[3]);const pd=(mx-mn)*.1||1;mn-=pd;mx+=pd;
 const X=t=>L+(t-t0)/(t1-t0||1)*(W-L-Rr),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B),P=a=>a.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(f(p.v)).toFixed(1)).join('');
 let g='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;g+=`<line class="gl" x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(META[m].d?1:0)}</text>`}
 for(let i=0;i<=4;i++){const t=t0+(t1-t0)*i/4;g+=`<text class="ax" x="${X(t)}" y="${H-6}" text-anchor="middle">${tm(t)}</text>`}
 const yb=Math.min(th[1],mx),ya=th[0]>0?Math.max(th[0],mn):mn;
 const dl=v=>v>mn&&v<mx?`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bad)" stroke-dasharray="5 4"/>`:'';
 CH[id]={pts:all,m,X,Y,t0,t1,W,L,Rr,n:pts.length,f};

 return `Сен — AIRWISE ақылды сынып мониторинг сайтының қазақ тіліндегі көмекшісісің, сенің атың BULBA AI. Мектеп оқушысына түсінікті, қысқа (6 сөйлемнен аз) және нақты жауап бер. Төмендегі деректерге сүйен, деректерде жоқ нәрсені ойлап таппа. ${S.demo?'ЕСКЕРТУ: қазір ДЕМО режим, мәндер модельденген, нақты өлшем емес — қажет болса осыны айт.':'Деректер нақты құрылғыдан келеді.'} Диагноз қойма; шекті мәндер — анықтамалық, барлық сынып пен ел үшін әмбебап стандарт емес. Құрылғы: ESP32, SCD40 (CO₂), BME680 (температура, ылғалдылық, қысым, VOC; CO₂ өлшемейді), шаң датчигі, дыбыс датчигі; корпус ауаны өзі тазартпайды, тек сыртқы жабдықты басқара алады.\nСынып: ${S.name}\nАғымдағы көрсеткіштер:\n${rows.join('\n')||'деректер жоқ'}\nАшық ескертулер: ${A.filter(a=>!a.done).map(a=>a.msg).join('; ')||'жоқ'}\n${f?`CO₂ болжамы (15 мин): шамамен ${Math.round(f.pred)} ppm, жылдамдық ${f.slope.toFixed(1)} ppm/мин`:''}`}
async function ask(t){t=(t||'').trim();if(!t||busy)return;CHAT.push({role:'user',content:t});const r={role:'assistant',content:''};CHAT.push(r);busy=true;render();sb();
 const h=[];CHAT.slice(0,-1).filter(m=>!m.err).slice(-9).forEach(m=>{const p=h[h.length-1];if(p&&p.role==m.role)p.content+='\n'+m.content;else h.push({role:m.role,content:m.content})});while(h.length&&h[0].role!='user')h.shift();
 try{const res=await fetch('/.netlify/functions/bulba',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:h,context:ctx()})});if(!res.ok)throw new Error(res.status);const d=await res.json();r.content=d.text||'Жауап алу мүмкін болмады.'}
 catch(e){r.err=1;r.content='BULBA AI серверіне қосыла алмадым. Сайт Netlify-да жарияланғанын және GEMINI_API_KEY қосылғанын тексеріңіз.'}
 busy=false;render();sb();const q=$('#q');if(q)q.focus()}
function botV(){return`<div class="card"><b>BULBA AI</b><div class="mu" style="font-size:12px;margin:2px 0 8px">Сыныптың ағымдағы көрсеткіштері бойынша сұрақ қойыңыз. Жауап жасанды интеллекттен келеді және қате болуы мүмкін${S.demo?'; қазір ДЕМО деректер қолданылып жатыр':''}.</div><div class="chips">${SUG.map((s,i)=>`<button class="chip" onclick="ask(SUG[${i}])" ${busy?'disabled':''}>${s}</button>`).join('')}</div><div id="chat">${CHAT.length?CHAT.map((m,i)=>`<div class="msg ${m.role} ${m.err?'err':''}"><div ${busy&&i==CHAT.length-1?'id="bl"':''}>${busy&&i==CHAT.length-1&&!m.content?'Ойланып жатыр…':esc(m.content)}</div></div>`).join(''):'<p class="mu">Мысалы: «Қазір CO₂ неге жоғары?» немесе жоғарыдағы сұрақтардың бірін басыңыз.</p>'}</div><div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="q" placeholder="Сұрағыңызды жазыңыз" style="flex:1" onkeydown="if(event.key=='Enter')ask(this.value)" ${busy?'disabled':''}><button class="btn" onclick="ask($('#q').value)" ${busy?'disabled':''}>Жіберу</button></div></div>`}

const setTheme=t=>{S.theme=t;save();document.documentElement.dataset.theme=t;render()},greet=()=>{const h=new Date().getHours();return h<5?'Қайырлы түн':h<12?'Қайырлы таң':h<18?'Қайырлы күн':'Қайырлы кеш'};

 if(p<4)return{x:'Мұрынмен дем алыңыз',s:(4-p)+' с',k:.7+.3*(p+1)/4,c};if(p<6)return{x:'Кідіріңіз',s:(6-p)+' с',k:1,c};return{x:'Ауызбен жай дем шығарыңыз',s:(12-p)+' с',k:1-.3*(p-5)/6,c}}

 $('#top').innerHTML=`<div><h1>${greet()}!</h1><div class="mu">Ақылды сыныптың экологиялық мониторингі · <span id="clk"></span></div></div><div class="chips" style="margin:0"><button class="chip ${(S.theme||'graphite')=='graphite'?'on':''}" onclick="setTheme('graphite')">Графит</button><button class="chip ${S.theme=='light'?'on':''}" onclick="setTheme('light')">Ақ</button><select aria-label="Сынып" onchange="S.name=this.value;save()">${cls.map(c=>`<option ${c==S.name?'selected':''}>${c}</option>`).join('')}</select>${o?`<span class="pill ${o}" style="font-size:14px;padding:5px 14px">Жүйе: ${STN[o]}</span>`:'<span class="pill warn">Деректер жоқ</span>'}</div>`;
